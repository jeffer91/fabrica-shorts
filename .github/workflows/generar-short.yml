name: Generar short

on:
  push:
    paths: ["guiones/**.json"]
  workflow_dispatch:
    inputs:
      guion:
        description: "Ruta del guion (ej. guiones/2026-11-26-01.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache de modelos (voz y subtitulos)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelos-v1

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Elegir guiones nuevos
        id: lista
        run: |
          if [ -n "${{ github.event.inputs.guion }}" ]; then
            echo "${{ github.event.inputs.guion }}" > lista.txt
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'guiones/*.json' > lista.txt || true
          fi
          cat lista.txt

      - name: Generar videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p salidas
          while read -r g; do
            [ -z "$g" ] && continue
            id=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$g")
            python scripts/generar.py "$g" build
            url=""
            if [ -n "$SUPABASE_URL" ]; then
              curl -sf -X POST "$SUPABASE_URL/storage/v1/object/shorts/$id.mp4" \
                -H "Authorization: Bearer $SUPABASE_KEY" -H "apikey: $SUPABASE_KEY" \
                -H "Content-Type: video/mp4" \
                --data-binary "@build/$id.mp4" && \
              url="$SUPABASE_URL/storage/v1/object/public/shorts/$id.mp4"
            fi
            if [ -z "$url" ]; then
              cp "build/$id.mp4" "salidas/$id.mp4"
            fi
            printf '{"id":"%s","url":"%s","estado":"listo","fecha":"%s"}\n' "$id" "$url" "$(date -Iseconds)" > "salidas/$id.json"
          done < lista.txt

      - name: Guardar resultado
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add salidas
          git commit -m "Videos generados" || echo "nada nuevo"
          git push
