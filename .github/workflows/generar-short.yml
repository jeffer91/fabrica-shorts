name: Generar short

on:
  push:
    paths: ["guiones/**.json"]
  workflow_dispatch:
    inputs:
      guion:
        description: "Ruta del guion (ej. guiones/2026-11-26-01.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache de modelos (voz y subtitulos)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: modelos-v1

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Traer voz, avatar y marca del estudio
        env:
          FN: https://omqmynobelpqzbzipxjz.supabase.co/functions/v1/estudio
          K: 0YtogzqxG1IbA8KKuOsmMh1f
        run: |
          lista=$(curl -sf --retry 4 --retry-all-errors "$FN?k=$K&accion=lista" | jq -r '.archivos[]') || { echo "Estudio no disponible"; exit 0; }
          if echo "$lista" | grep -q '^voz/'; then find voz -type f ! -name .gitkeep -delete; fi
          if echo "$lista" | grep -q '^assets/'; then find assets -type f ! -name .gitkeep -delete; fi
          for r in $lista; do
            mkdir -p "$(dirname "$r")"
            curl -sf --retry 4 --retry-all-errors --retry-delay 3 "$FN?k=$K&accion=bajar&ruta=$r" -o "$r" && echo "Traido del estudio: $r" || echo "FALLO al traer $r"
          done

      - name: Elegir guiones pendientes
        run: |
          : > lista.txt
          if [ -n "${{ github.event.inputs.guion }}" ]; then
            echo "${{ github.event.inputs.guion }}" > lista.txt
          else
            for g in guiones/*.json; do
              [ -e "$g" ] || continue
              id=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$g")
              [ -e "salidas/$id.json" ] || echo "$g" >> lista.txt
            done
          fi
          cat lista.txt

      - name: Generar videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://omqmynobelpqzbzipxjz.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tcW15bm9iZWxwcXpiemlweGp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNDQwODUsImV4cCI6MjEwOTcyMDA4NX0.-70SSFVWYJ1mnZlVbSbQu2lmSupJC9_6EBT4VK4ynx8' }}
        run: |
          mkdir -p salidas
          while read -r g; do
            [ -z "$g" ] && continue
            id=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['id'])" "$g")
            python scripts/generar.py "$g" build
            cp "build/$id-imagenes.jpg" salidas/ 2>/dev/null || true
            url=""
            nombre="$id-$(date +%H%M%S)"
            if [ -n "$SUPABASE_URL" ]; then
              curl -sf -X POST "$SUPABASE_URL/storage/v1/object/shorts/$nombre.mp4" \
                -H "Authorization: Bearer $SUPABASE_KEY" -H "apikey: $SUPABASE_KEY" \
                -H "Content-Type: video/mp4" \
                --data-binary "@build/$id.mp4" && \
              url="$SUPABASE_URL/storage/v1/object/public/shorts/$nombre.mp4"
            fi
            if [ -z "$url" ]; then
              cp "build/$id.mp4" "salidas/$id.mp4"
            fi
            printf '{"id":"%s","url":"%s","estado":"listo","fecha":"%s"}\n' "$id" "$url" "$(date -Iseconds)" > "salidas/$id.json"
          done < lista.txt

      - name: Guardar resultado
        run: |
          git config user.name "fabrica-bot"
          git config user.email "fabrica-bot@users.noreply.github.com"
          git add salidas
          git commit -m "Videos generados" || echo "nada nuevo"
          git stash -u -q || true
          git pull --rebase -q && git push
